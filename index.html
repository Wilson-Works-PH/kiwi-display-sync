    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiwi — Every screen. One platform.</title>
    <meta
      name="description"
      content="Manage, schedule, and publish digital signage across all your screens from one simple dashboard. Try the live demo."

    <meta property="og:title" content="Kiwi — Every screen. One platform." />

  <body>
    <script>
      // Stamp the stored theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem("kds:theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
